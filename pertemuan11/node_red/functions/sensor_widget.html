<template>
  <section aria-label="Pengamatan DHT22" class="sensor-reading">
    <p v-if="!msg || !msg.payload || !msg.payload.waktu">
      Belum ada pengamatan. Jalankan ESP32 dan cocokkan topic root.
    </p>
    <template v-else>
      <dl>
        <div><dt>Suhu</dt><dd>{{ Number(msg.payload.suhu).toFixed(1) }} C</dd></div>
        <div><dt>Kelembapan</dt><dd>{{ Number(msg.payload.kelembapan).toFixed(1) }} %</dd></div>
      </dl>
      <p>Waktu pengamatan: {{ msg.payload.waktu }} (UTC)</p>
    </template>
  </section>
</template>

.sensor-reading dl { margin: 0; }
